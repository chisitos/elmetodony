# Directorio de tiendas — Remodelar Medellín
#
# Esta es la base de datos del sitio. Editar aquí cambia el directorio, las
# rutas y el buscador: no hay que tocar código. Después de editar, correr:
#     python run.py --site-only
#
# Campos:
#   slug        id en la URL (/directorio/<slug>.html). Único, sin tildes.
#   nombre      como se muestra
#   zona        una de las zonas definidas en config/rutas.yaml
#   categorias  una o varias de: banos, pisos, cocinas, iluminacion, diseno,
#               tech-home, jardines, infantil
#   direccion   dirección completa — se usa tal cual para "Cómo llegar"
#   local       local dentro de un centro comercial (opcional)
#   nivel       accesible | medio | alto | especializado
#   aporta      frase corta: qué se resuelve ahí
#   en_ideo     true si está dentro del CC IDEO (Autopista Sur, Itagüí)
#   telefono    opcional — formato +57...
#   whatsapp    opcional — solo dígitos, con indicativo: 573001234567
#   web         opcional
#   horario     opcional

tiendas:

