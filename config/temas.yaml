# Plan editorial propio — Feria Remodelar
#
# De aquí sale un artículo por día, de lunes a viernes. Son nuestros: los
# escribimos nosotros, con nuestras fotos o con fotos de licencia abierta,
# y no dependen de que un medio extranjero nos deje republicar. Esa fue la
# razón de empezarlos: las notas curadas colgaban la foto del medio
# original sin licencia y hubo que retirarlas.
#
# Cada tema se marca `publicado: true` cuando sale, y el motor toma el
# siguiente sin publicar. Agregar temas al final es lo normal; el orden de
# la lista es el orden de publicación.
#
# tipo:        material | guia | combinar | tendencia | inspiracion | entrevista
# angulo:      qué tiene que resolverle al lector. Es lo que evita la nota
#              de relleno: si no hay ángulo, no hay nota.
# ruta:        slug de config/rutas.yaml al que enlaza, para que el lector
#              salga del artículo sabiendo a dónde ir a verlo.
# categorias:  slugs de categorías de tienda que el motor usa para traer
#              almacenes reales del directorio al cierre del artículo.
# precios:     true si la nota necesita precios verificados. El motor los
#              busca y los publica con mes y almacén; sin eso no los pone.
# foto:        consulta en inglés para Openverse (indexa en inglés).

pilares:
  material: "Qué es, dónde se usa bien, dónde se daña, y qué cuesta."
  guia: "Cómo se hace o cómo se elige, paso por paso y con medidas."
  combinar: "Qué va con qué: color, textura, materiales, luz."
  tendencia: "Qué está pasando y si vale la pena, dicho sin humo."
  inspiracion: "Un espacio real, contado por lo que se le puede copiar."
  entrevista: "Alguien que sabe, respondiendo preguntas concretas."

# Las entrevistas NO las genera el motor. Una cita inventada puesta en boca
# de una persona real es una mentira y un problema legal. Para esas, el
# motor arma el cuestionario y el correo de contacto; la nota se escribe
# cuando la persona responda de verdad.
entrevistas_requieren_fuente_real: true

temas:
  - slug: porcelanato-vs-ceramica
    tipo: material
    titulo: "Porcelanato o cerámica: en qué se diferencian de verdad"
    angulo: >
      En la tienda los dos se ven iguales y el precio se dispara al doble.
      La diferencia está en la absorción de agua y en el PEI, y define si
      el piso aguanta un baño, una cocina o una terraza en Medellín.
    ruta: pisos-toda-la-casa
    categorias: [pisos]
    precios: true
    foto: "porcelain tile floor interior"

  - slug: medir-antes-de-comprar-bano
    tipo: guia
    titulo: "Las seis medidas que hay que tomar antes de comprar nada para el baño"
    angulo: >
      Casi toda la plata que se pierde remodelando un baño se pierde por
      una medida que nadie tomó. Cuáles son, cómo se toman y qué margen
      dejar para el enchape y la puerta.
    ruta: bano-completo
    categorias: [banos]
    precios: false
    foto: "small bathroom interior measuring"

  - slug: combinar-madera-y-blanco
    tipo: combinar
    titulo: "Madera y blanco: por qué funciona casi siempre y cuándo no"
    angulo: >
      Es la combinación más repetida y la más fácil de arruinar. El error
      está en mezclar maderas de distinta temperatura y en el blanco:
      no es uno solo, y con luz cálida de Medellín se pone amarillo.
    ruta: cocina-integral
    categorias: [cocinas, diseno]
    precios: false
    foto: "wood and white kitchen interior"

  - slug: luz-calida-o-fria
    tipo: guia
    titulo: "Luz cálida o fría: la decisión que cambia cómo se ve todo lo demás"
    angulo: >
      Los grados kelvin explicados por lo que hacen: qué le pasa a una
      madera, a un mármol y a un blanco bajo 2700K y bajo 6000K, y por qué
      el enchape que escogió en la tienda se ve distinto en su casa.
    ruta: iluminacion-de-la-casa
    categorias: [iluminacion]
    precios: true
    foto: "warm interior lighting living room"

  - slug: microcemento-la-verdad
    tipo: material
    titulo: "Microcemento: lo que sí hace y lo que le van a vender de más"
    angulo: >
