# Configuración editorial de Remodelar — motor editorial de arquitectura
# interior y remodelación de espacios, hecho para diseñadores. Este archivo
# controla el alcance temático, el criterio del agente curador y la voz del
# agente editor, sin tocar código.

publication:
  name: "Remodelar"
  tagline: "Ediciones semanales de arquitectura interior y remodelación"
  language: "es"

models:
  # IDs de modelo Claude a usar en cada rol. Se pueden fijar por variable de
  # entorno (ANTHROPIC_MODEL_*) para no editar este archivo en cada corrida.
  research: "claude-sonnet-5"
  curator: "claude-sonnet-5"
  editor: "claude-opus-5"

run:
  lookback_days: 8            # qué tan atrás mirar en RSS / búsqueda web (~1 semana + margen)
  max_rss_per_feed: 12         # tope de items crudos por feed antes de filtrar
  max_web_queries: 4           # nº de búsquedas web que hace el agente investigador
  # Techo de artículos por EDICIÓN SEMANAL — no es un objetivo a cumplir.
  # No tiene que ser infinito: mejor una edición de 3 piezas muy buenas que
  # una de 8 con relleno. El curador puede seleccionar menos, o ninguna.
  max_selected_per_run: 8
  min_score_to_select: 6.5     # sobre 10 — umbral del rubro ponderado
  dedup_lookback_articles: 40  # nº de notas recientes que ve el curador para nunca repetir

# Alcance temático: el agente de RSS pre-filtra con esto antes de gastar
# tokens en el curador. El curador aplica el mismo alcance con más criterio.
scope:
  include_keywords:
    - interior
    - interiores
    - remodel
    - renovation
    - renovación
    - remodelación
    - retrofit
    - adaptive reuse
    - reforma
    - apartment
    - departamento
    - loft
    - house renovation
    - casa
    - vivienda
    - hospitality design
    - retail design
    - office interior
    - oficinas
    - material
    - materiales
    - furniture
    - mobiliario
    - lighting design
    - iluminación
    - kitchen
    - cocina
    - bathroom
    - baño
    - textile
    - textil
    - sustainable materials
    - biomateriales
  exclude_keywords:
    - urban planning only
    - skyscraper competition
    - masterplan
    - stadium
    - airport terminal

# Rubro de selección del agente curador. Cada candidato se puntúa 0-10 en
# cada eje; el score final es la suma ponderada. Ajustar pesos aquí cambia
# el criterio editorial sin tocar prompts.
rubric:
  weights:
    novedad: 0.22            # ¿es genuinamente nuevo / no visto ya / no repetido?
    actualidad: 0.18          # ¿qué tan reciente es (fecha de publicación)?
    utilidad: 0.18            # ¿le sirve a un lector que diseña o remodela?
    uso_materiales: 0.20      # ¿hay especificidad de materiales/técnica?
    tendencia_industria: 0.14 # ¿conecta con una tendencia real de la industria?
    encaje_tematico: 0.08     # ¿encaja con el alcance de interiores/remodelación?

# Guía de voz para el agente editor. Esto SE INYECTA tal cual en el prompt
# del editor — es la fuente de verdad del tono de Remodelar. Editar aquí
# cambia el estilo de todos los artículos futuros.
voice:
  # El espanol de aqui es colombiano: usted o tu, nunca vos. Estas reglas
  # estaban escritas en voseo ("Abri", "Nombra", "deci"), y el modelo
  # copiaba ese registro en lo que publicaba.
  principles:
    - "Abra con una imagen concreta o un dato especifico. Nunca con 'En un mundo donde...' ni frases genericas de introduccion."
    - "Escriba en espanol colombiano. Trate al lector de usted o de tu, nunca de vos, y evite el lexico de Espana (coger, piso por apartamento, grifo por llave)."
    - "El lector es alguien que va a remodelar su casa en Medellin, no un critico de diseno. Lo que busca es decidir bien y no perder plata."
    - "Precision material: diga cual material, cual tecnica y como se usa. Nunca 'materiales innovadores'."
    - "Precios en pesos colombianos, con el mes y el almacen donde se tomaron, y advirtiendo que son de referencia. Un precio sin fecha envejece mal y queda mintiendo."
    - "Alterne frases cortas y declarativas con una larga por parrafo. Ritmo, no relleno."
    - "Cero cliches de marketing: nada de 'revolucionario', 'unico en su tipo', 'a nivel mundial'."
    - "Cierre con algo que el lector pueda hacer: que medir, que preguntar, donde ir a verlo."
    - "Nunca invente datos, precios ni citas. Si algo no esta confirmado, digalo o quitelo."
    - "Nunca atribuya una frase a una persona real que no la haya dicho en una entrevista hecha de verdad."
  forbidden_phrases:
    - "revolucionario"
    - "unico en su tipo"
    - "a nivel mundial"
    - "en un mundo donde"
    - "sin duda"
    - "cabe destacar"
    - "vos"
  target_length_words: [280, 480]
