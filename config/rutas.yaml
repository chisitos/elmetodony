# ─────────────────────────────────────────────────────────────────────────
# Categorías — con qué se etiqueta cada tienda
# ─────────────────────────────────────────────────────────────────────────
categorias:
  - slug: banos
    nombre: "Baños"
    descripcion: "Sanitarios, grifería, duchas, enchape y muebles de baño."
  - slug: pisos
    nombre: "Pisos y enchapes"
    descripcion: "Porcelanato, cerámica, laminado, vinilo y madera."
  - slug: cocinas
    nombre: "Cocinas"
    descripcion: "Cocinas integrales, mesones, carpintería y empotrados."
  - slug: iluminacion
    nombre: "Iluminación"
