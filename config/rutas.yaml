# Rutas de remodelación — Remodelar Medellín
#
# Una RUTA es un camino de compra: el orden real en que hay que resolver un
# proyecto, con 4-6 paradas y tiendas concretas en cada una. No es un
# listado: es "salga un sábado y resuelva el baño".
#
# Criterio de negocio: IDEO (Autopista Sur, Itagüí) es el centro comercial
# de remodelación de la ciudad y concentra la OBRA — pisos, enchapes,
# sanitarios, grifería, cocinas y electrodomésticos. Toda ruta de obra
# arranca ahí porque ahí se resuelve en una sola parada; después sale a
# completar decoración en Envigado, Poblado o Laureles. Las rutas que no
# tocan obra (decoración pura) existen, pero no son el corazón del sitio.

sitio:
  nombre: "Remodelar"
  tagline: "Rutas de remodelación en Medellín"
  descripcion: >-
    El mapa de dónde comprar para remodelar en Medellín. Rutas armadas por
    proyecto, con las tiendas en el orden en que hay que visitarlas.
  ciudad: "Medellín"

# El ancla del ecosistema.
ancla:
  slug: ideo
  nombre: "IDEO"
  nombre_largo: "IDEO — Centro Comercial de Remodelación"
  direccion: "Cra. 42 (Autopista Sur) #75-83, Itagüí"
  claim: "Todo lo de obra, en un solo lugar"
  descripcion: >-
    IDEO es el único punto de Medellín donde pisos, enchapes, sanitarios,
    grifería, cocinas integrales y electrodomésticos están en el mismo
    edificio. Lo que en otra parte son cinco sábados de tráfico, acá es una
    mañana: se compara porcelanato en tres locales seguidos, se escoge
    sanitario dos puertas más allá y se cierra la cocina en el segundo piso.
  por_que:
    - "8 locales de obra en el mismo edificio — se compara sin volver a montarse al carro"
    - "Sobre la Autopista Sur: entrada y salida directa, con parqueadero"
    - "Pisos, baño y cocina resueltos el mismo día"
    - "Medidas y cotizaciones de varios proveedores en una sola visita"

