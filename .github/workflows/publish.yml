name: Remodelar — edición semanal y publicación

# Sin horario: solo a mano.
#
# Esta es la edicion CURADA de medios ajenos. Se le quito el cron de los
# lunes porque esas notas colgaban la foto del medio original sin licencia
# y hubo que retirar veintinueve. El motor ya no publica una nota sin foto
# con licencia (ver pipeline/orchestrator.py), pero mientras la fuente de
# contenido sea el plan propio de config/temas.yaml, esto no debe correr
# solo. La publicacion diaria vive en nota-diaria.yml.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pipeline editorial (agentes)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py --pipeline-only -v

      - name: Commit de artículos nuevos
        run: |
          git config user.name "remodelar-bot"
          git config user.email "remodelar-bot@users.noreply.github.com"
          git add data/articles data/seen.json
          git diff --staged --quiet || git commit -m "Remodelar: edición semanal $(date -u +%Y-%m-%d)"
          git push

      - name: Generar sitio estático
        run: python run.py --site-only

      - name: Subir artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run-pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Publicar también en el hosting propio. GitHub Pages queda como espejo;
  # el dominio de verdad es feriaremodelar.com.
  hosting:
    needs: deploy
    uses: ./.github/workflows/_deploy-sftp.yml
    secrets: inherit
