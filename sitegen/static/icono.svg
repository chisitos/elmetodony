  <rect width="512" height="512" fill="#0a0a0a"/>
  <path d="M150 150 L150 300 L362 300"
        fill="none" stroke="#e4007c" stroke-width="34"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="112" y="112" width="76" height="76" fill="#ffffff"/>
  <rect x="324" y="262" width="76" height="76" fill="#e4007c"/>
</svg>
